<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7955e8"><title>המערכת של ליה</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="file_00000000a6a88210af87fb0c273eaff8.png"><link rel="icon" type="image/png" href="file_00000000a6a88210af87fb0c273eaff8.png"><style>:root{font-family:system-ui,-apple-system,Arial;background:#f7f5ff;color:#241a43}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#7955e8,#ad77eb);color:white;padding:28px 18px 24px;border-radius:0 0 28px 28px}main{max-width:700px;margin:auto;padding:18px}h1{margin:0;font-size:29px}header p{margin:8px 0 0;opacity:.9}.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:18px 0}.days button{border:0;border-radius:13px;padding:12px 0;background:#fff;color:#493b71;font-size:15px;font-weight:700}.days button.active{background:#7955e8;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button,.save{border:0;border-radius:12px;background:#e7ddff;padding:11px 14px;color:#382268;font-weight:700}.lesson{background:white;border-radius:18px;padding:17px;margin:10px 0;box-shadow:0 5px 20px #3622670b;display:grid;grid-template-columns:45px 1fr auto;gap:12px;align-items:center}.num{font-weight:800;color:#8064c7;font-size:21px}.subject{font-weight:800;font-size:19px}.details{color:#685f7d;font-size:14px;margin-top:5px}.room{background:#efe7ff;border-radius:12px;padding:9px;text-align:center;min-width:78px}.room strong{font-size:19px;display:block}.room small{font-size:11px}.warning{font-size:13px;color:#76658e;margin:14px 0}.edit{background:#fff;border-radius:20px;padding:18px;margin-top:20px}label{display:block;font-weight:700;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #ded6f0;border-radius:10px;font:inherit;margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{background:#7955e8;color:white;margin-top:16px;width:100%}.muted{color:#776c89}.hide{display:none}.danger{background:#ffe8ec!important;color:#a32b4d!important}footer{text-align:center;color:#857a9a;font-size:12px;padding:25px}</style></head><body><header><div style="max-width:700px;margin:auto"><h1>💜 המערכת של ליה</h1><p>כיתה ח׳ • כל שיעור, כל חדר, בלי להתבלבל</p></div></header><main><div class="toolbar"><button id="today">📍 היום</button><button id="tomorrow">✨ מחר</button><button id="editToggle">✏️ עריכה</button></div><nav class="days" id="days"></nav><h2 id="dayTitle"></h2><div id="lessons"></div><p class="warning">📌 המספרים בסוגריים בתמונה המקורית הם מספרי כיתות. סימן ? פירושו שלא הצלחנו לקרוא את הנתון בביטחון. בדקי מול בית הספר.</p><section class="edit hide" id="editor"><h2>עריכת שיעור</h2><p class="muted">השינויים נשמרים במכשיר הזה בלבד. לשיתוף עם כולם יש לעדכן את קובץ הנתונים ב-GitHub.</p><label>יום<select id="eDay"></select></label><label>שיעור<select id="ePeriod"></select></label><label>מקצוע<input id="eSubject" placeholder="לדוגמה: מתמטיקה"></label><div class="row"><label>מורה<input id="eTeacher" placeholder="שם המורה"></label><label>כיתה / חדר<input id="eRoom" placeholder="01.28"></label></div><label>הערה<input id="eNote" placeholder="למשל: קבוצה א׳"></label><button class="save" id="save">שמירה ✓</button><button class="save danger" id="reset">איפוס לשעות המקוריות</button></section></main><footer>נבנה במיוחד בשביל ליה 💜</footer><script src="schedule.js"></script><script src="app.js"></script></body></html>
